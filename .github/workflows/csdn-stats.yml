name: Update CSDN Stats

# 每天把 CSDN 的访问量 / 原创 / 粉丝写进 csdn.json，README 的徽章会自动更新
on:
  schedule:
    - cron: "0 2 * * *"      # UTC 02:00 = 北京时间 10:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取 CSDN 数据
        run: python scripts/csdn_stats.py

      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain csdn.json)" ]; then
            git add csdn.json
            git commit -m "chore: 更新 CSDN 统计 $(date +%F)"
            git push
          else
            echo "数据无变化，跳过提交"
          fi
